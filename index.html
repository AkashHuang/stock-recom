    tb.innerHTML='';

      tb.innerHTML='<tr><td colspan="9" class="empty">该板块当前无符合条件的金叉股</td></tr>';

      if(chart){chart.dispose();chart=null;}

  }

  function renderTableSel(){
    const rows=document.getElementById('stockRows').children;
