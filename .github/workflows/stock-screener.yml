name: Stock Screener

on:
  schedule:
    # 北京时间 16:00（收盘后约1小时）= UTC 08:00；周一~周五
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener (skip on non-trading days)
        run: python update.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
